<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        fill: #d4af37;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#1a1f2c"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d4af37" stroke-width="16"/>
  <!-- Luxurious Serif "L" -->
  <text x="256" y="340" class="logo-text" font-size="300" text-anchor="middle">L</text>
</svg>
